version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
  - package-ecosystem: npm
    directory: /WEB
    schedule:
      interval: monthly
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      mineures-et-correctifs:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /SCRIPT
    schedule:
      interval: monthly
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      mineures-et-correctifs:
        patterns: ["*"]
        update-types: [minor, patch]
