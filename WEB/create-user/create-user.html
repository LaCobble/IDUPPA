<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Créer un Utilisateur</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css">
  <link rel="stylesheet" href="create-user.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary-purple p-2">
    <div class="container d-flex justify-content-between">
      <a href="/admin-panel" class="navbar-brand text-white text-decoration-none">
        <i class="fa fa-home"></i> Dashboard
      </a>
      <a class="nav-link text-white" href="/profile-user">Mon Profil</a>
    </div>
  </nav>

<div class="container">
  <form id="user_form">
    <h2 class="text-center mb-4">Créer un Nouvel Utilisateur</h2>

    <div class="form-group mb-3">
      <label for="username">Nom d'utilisateur</label>
      <input type="text" class="form-control" id="username" name="username" placeholder="Nom d'utilisateur" required>
    </div>

    <div class="form-group mb-3">
      <label for="email">Email</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="Adresse email" required>
    </div>

    <div class="form-group mb-3">
      <label for="first_name">Prénom</label>
      <input type="text" class="form-control" id="first_name" name="first_name" placeholder="Prénom" required>
    </div>

    <div class="form-group mb-3">
      <label for="last_name">Nom</label>
      <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Nom" required>
    </div>

    <div class="form-group mb-3">
      <label for="password">Mot de passe</label>
      <input type="password" class="form-control" id="password" name="password" placeholder="Mot de passe" required>
    </div>

    <div class="form-group mb-3">
      <label for="date_of_birth">Date de naissance</label>
      <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" required>
    </div>

    <div class="form-group mb-3">
      <label for="city">Ville</label>
      <input type="text" class="form-control" id="city" name="city" placeholder="Ville" required>
    </div>

    <div class="form-group mb-3">
      <label for="country">Pays</label>
      <input type="text" class="form-control" id="country" name="country" placeholder="Pays" required>
    </div>

    <div class="form-group mb-3">
      <label for="sexe">Sexe</label>
      <select class="form-control" id="sexe" name="sexe" required>
        <option value="Homme">Homme</option>
        <option value="Femme">Femme</option>
        <option value="Autre">Autre</option>
      </select>
    </div>

    <div class="form-group mb-3">
      <label for="profession">Profession</label>
      <input type="text" class="form-control" id="profession" name="profession" placeholder="Profession" required>
    </div>

    <div class="form-group mb-3">
      <label for="role_id">Rôle</label>
      <input type="number" class="form-control" id="role_id" name="role_id" placeholder="ID du rôle">
    </div>

    <div class="form-group mb-3">
      <label for="data_access_level">Niveau d'accès aux données</label>
      <select class="form-control" id="data_access_level" name="data_access_level">
        <option value="0">Clair</option>
        <option value="1">Pseudonymisé</option>
        <option value="2">Anonymisé</option>
        <option value="3">Aucun</option>
      </select>
    </div>

    <div id="success_message" class="alert alert-success mt-3">Utilisateur créé avec succès !</div>

    <button type="submit" class="btn btn-primary w-100">Créer l'Utilisateur</button>
  </form>
</div>

<script>
  document.getElementById("user_form").addEventListener("submit", async function(event) {
      event.preventDefault();
      const formData = new FormData(this);
      const userData = Object.fromEntries(formData);

      try {
          const response = await fetch("/api/users", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json"
              },
              body: JSON.stringify(userData)
          });
          const result = await response.json();
          if (result.success) {
              alert("Utilisateur créé avec succès !");
          } else {
              alert("Erreur lors de la création de l'utilisateur.");
          }
      } catch (error) {
          console.error("Erreur:", error);
      }
  });
  </script>

</body>
</html>
