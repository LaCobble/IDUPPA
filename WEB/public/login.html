<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="./login.css">

</head>
<body>

<div class="blurred-box">
  <form action="/login" method="post">
    <div class="user-login-box">
      <span class="user-icon"></span>
      <input class="user-username" name="username" type="text" placeholder="Nom d'utilisateur" required />
      <input class="user-password" name="password" type="password" placeholder="Mot de passe" required />
      <button type="submit">Connexion</button>
    </div>
  </form>
  </div>
</div>
</body>
</html>
