<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User List</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css" integrity="sha384-r4NyP46KrjDleawBgD5tp8Y7UzmLA05oM1iAEQ17CSuDqnUK2+k9luXQOfXJCJ4I" crossorigin="anonymous">
  <link rel="stylesheet" href="../admin-panel/Admin-Panel.css">
</head>
<body>

<header class="bg-purple text-white p-3">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="logo">
      <a href="/admin-panel" class="text-white text-decoration-none">
        <i class="fa fa-home"></i> Dashboard
      </a>
    </div>

    <nav class="nav">
      <a class="nav-link text-white" href="/profile-user">Mon Profil</a>
    </nav>
</header>

  <div class="container py-5">
    <h1 class="mb-4">Liste des Utilisateurs</h1>

    <button class="btn btn-primary mb-3" onclick="togglePseudonymization()">Pseudonymisation</button>

    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="bg-purple text-white">
          <tr>
            <th>ID</th>
            <th>Nom d'utilisateur</th>
            <th>Email</th>
            <th>Prénom</th>
            <th>Nom</th>
            <th>Date de Naissance</th>
            <th>Ville</th>
            <th>Pays</th>
            <th>Sexe</th>
            <th>Profession</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const noms = ["Dupont", "Martin", "Bernard", "Robert", "Richard"];
    const prenoms = ["Jean", "Marie", "Luc", "Sophie", "Julie"];

    let pseudonymized = false;

    // Fonction pour basculer la pseudonymisation
    function togglePseudonymization() {
      pseudonymized = !pseudonymized;
      fetchUsers();
    }
    async function fetchUsers() {
      try {
        const response = await fetch('/api/users');
        const users = await response.json();

        const userTableBody = document.getElementById('userTableBody');
        userTableBody.innerHTML = '';

        users.forEach(user => {
          let FirstNameName = user.last_name;
          let FirstName = user.first_name;
          let email = user.email;

          if (pseudonymized) {
            FirstNameName = noms[Math.floor(Math.random() * noms.length)];
            FirstName = prenoms[Math.floor(Math.random() * prenoms.length)];
            email = FirstName.toLowerCase() + '.' + FirstNameName.toLowerCase() + "@email.fr";
          }

          const row = `
            <tr>
              <td>${user.id}</td>
              <td>${user.username}</td>
              <td>${email}</td>
              <td>${FirstName}</td>
              <td>${FirstNameName}</td>
              <td>${user.date_of_birth}</td>
              <td>${user.city}</td>
              <td>${user.country}</td>
              <td>${user.sexe}</td>
              <td>${user.profession}</td>
            </tr>
          `;
          userTableBody.insertAdjacentHTML('beforeend', row);
        });
      } catch (error) {
        console.error("Erreur lors de la récupération des utilisateurs:", error);
      }
    }

    document.addEventListener('DOMContentLoaded', fetchUsers);
  </script>
</body>
</html>
